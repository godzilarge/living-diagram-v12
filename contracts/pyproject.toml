[project]
name = "ld-contracts"
version = "1.0.0"
description = "Living Diagram — contrats RunBundle v1 (entrée) et Snapshot v1 (sortie) : modèles Pydantic, JSON Schema, validateur, anonymiseur"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Proprietary" }
dependencies = [
  "pydantic>=2.13,<3",
]

[project.scripts]
ld-contracts = "ld_contracts.cli:main"

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-cov>=7.0",
  "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ld_contracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["ld_contracts"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "A", "C4", "SIM", "RET"]
