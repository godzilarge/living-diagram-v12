<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="{{CSP}}">
<title>{{TITLE}}</title>
<style>{{STYLE}}</style>
</head>
<body>
<header class="top">
  <div class="brand">Living Diagram <span class="brand-sub">lecture d'un snapshot</span></div>
  <div class="run" id="run-meta"></div>
  <div class="counts" id="run-counts"></div>
</header>
<nav class="timeline" id="timeline" aria-label="Runs archivées de l'infrastructure" hidden></nav>
<nav class="tabs" id="tabs" role="tablist"></nav>
<p id="live" class="sr-only" aria-live="polite"></p>
<main>
  <section class="view" id="view-shell" hidden></section>
  <section class="view" id="view-graph" role="tabpanel" aria-labelledby="tab-graph">
    <div class="canvas-wrap">
      <div class="toolbar" id="graph-toolbar"></div>
      <div class="canvas-stage">
        <svg id="canvas" role="group" aria-label="Graphe des équipements et des câbles"></svg>
        <div class="legend" id="graph-legend"></div>
      </div>
    </div>
    <aside class="inspector" id="inspector"></aside>
  </section>
  <section class="view" id="view-diff" role="tabpanel" aria-labelledby="tab-diff" hidden></section>
  <section class="view" id="view-intent" role="tabpanel" aria-labelledby="tab-intent" hidden></section>
  <section class="view" id="view-structures" role="tabpanel" aria-labelledby="tab-structures" hidden></section>
  <section class="view" id="view-checks" role="tabpanel" aria-labelledby="tab-checks" hidden></section>
  <section class="view" id="view-quality" role="tabpanel" aria-labelledby="tab-quality" hidden></section>
  <section class="view" id="view-sources" role="tabpanel" aria-labelledby="tab-sources" hidden></section>
</main>
<noscript><p class="fatal">Cette page a besoin de JavaScript : tout le rendu se fait dans le navigateur, sans réseau.</p></noscript>
<script type="application/json" id="ld-data">{{DATA}}</script>
<script id="ld-viewer">{{SCRIPT}}</script>
</body>
</html>
