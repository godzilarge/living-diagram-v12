[project]
name = "ld-backend"
version = "0.1.0"
description = "Living Diagram — backend : ingestion des bundles (porte d'entrée), archivage, API REST"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.120",
  "ld-contracts",
]

[project.scripts]
ld = "ld_backend.cli:main"

[dependency-groups]
dev = [
  "pytest>=9.1",
  "pytest-cov>=7.0",
  "httpx>=0.28",
  "uvicorn>=0.34",
  "ruff>=0.14",
]

[tool.uv.sources]
ld-contracts = { path = "../contracts", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ld_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["ld_backend"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "A", "C4", "SIM", "RET"]
